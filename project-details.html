    <meta charset="UTF-8">

    <title>تفاصيل المشروع - Momen Saleh</title>
       <meta name="description"
      id="metaDescription"
      content="Design project by Momen Saleh, professional Graphic Designer and UI/UX Designer specializing in branding, social media design and creative digital experiences.">

<meta name="robots"
      content="index, follow, max-image-preview:large">

<link rel="canonical"
      id="canonicalUrl"
      href="https://momen-portfolio.pages.dev/project-details.html"> 
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --primary: #4da6ff;
            --primary-light: #7ab9ff;
            --primary-dark: #2d8aff;
            --accent: #00ceed;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0a0a0a;
            --dark-100: #121212;
            --dark-200: #1e1e1e;
            --dark-300: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #6b6b6b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-border-hover: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --border-radius-sm: 12px;
            --border-radius: 16px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
            --border-radius-2xl: 40px;
            --border-radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --font-primary: 'Plus Jakarta Sans', sans-serif;
            --font-arabic: 'Cairo', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background: var(--dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .noise-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        .gradient-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, rgba(77, 166, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            top: -200px;
            right: -200px;
            z-index: -1;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .gradient-orb-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at center, rgba(0, 206, 237, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            bottom: -200px;
            left: -200px;
            z-index: -1;
            animation: orbFloat 25s ease-in-out infinite reverse;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--glass-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* ===== MAIN CONTAINER ===== */
        .project-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 30px 40px;
            position: relative;
        }

        /* ===== NAVIGATION BAR ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-full);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            transform: translateX(-5px);
        }

        .back-button i {
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .back-button:hover i {
            transform: translateX(-3px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ceed, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .nav-action {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-full);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 1.2rem;
        }

        .nav-action:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--text-tertiary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .breadcrumb a:hover {
            color: var(--primary);
        }

        .breadcrumb i {
            font-size: 0.7rem;
            color: var(--primary);
        }

        .breadcrumb .current {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== PROJECT HEADER ===== */
        .project-header {
            margin-bottom: 60px;
        }

        .category-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, rgba(77, 166, 255, 0.1), rgba(0, 206, 237, 0.1));
            border: 1px solid rgba(77, 166, 255, 0.2);
            border-radius: var(--border-radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }

        .project-title {
            max-width: 800px;
        }

        .project-title h1 {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .project-title .short-desc {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        .project-rating {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            color: #fbbf24;
            font-size: 1.2rem;
        }

        .rating-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .rating-text strong {
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        /* ===== META GRID ===== */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .meta-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .meta-item:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            transform: translateY(-3px);
        }

        .meta-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .meta-content {
            flex: 1;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== GALLERY SECTION ===== */
        .gallery-section {
            margin-bottom: 80px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .gallery-main {
            position: relative;
            border-radius: var(--border-radius-xl);
            overflow: hidden;
            aspect-ratio: 16/9;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .gallery-main:hover img {
            transform: scale(1.05);
        }

        .gallery-main-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-main:hover .gallery-main-overlay {
            opacity: 1;
        }

        .gallery-main-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-full);
            color: white;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .gallery-thumbnails {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery-thumb {
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .gallery-thumb:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        .gallery-thumb.active {
            border-color: var(--primary);
            opacity: 1;
            box-shadow: 0 10px 30px -10px var(--primary);
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 80px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--glass-bg), transparent);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 30px 20px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s ease;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px -20px var(--primary);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== CONTENT LAYOUT ===== */
        .content-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            margin-bottom: 80px;
        }

        /* Cards Base */
        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            transition: var(--transition);
            margin-bottom: 30px;
        }

        .content-card:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        .card-header-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }

        .card-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* Overview */
        .overview-text {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .details-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
        }

        .detail-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .detail-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius-sm);
            background: rgba(77, 166, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1rem;
        }

        .detail-content {
            flex: 1;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-bottom: 2px;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Challenge & Solution */
        .split-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .split-item {
            padding: 25px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .split-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .split-icon {
            width: 45px;
            height: 45px;
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .split-item.challenge .split-icon {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .split-item.solution .split-icon {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .split-item h4 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .split-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Colors */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .color-item {
            height: 80px;
            border-radius: var(--border-radius);
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
        }

        .color-item:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
        }

        .color-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 0.8rem;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .color-item:hover .color-info {
            transform: translateY(0);
        }

        /* Tags */
        .tags-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            padding: 8px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-full);
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .tag:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        /* Tools */
        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
        }

        .tool-item:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(5px);
        }

        .tool-icon {
            width: 45px;
            height: 45px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .tool-info {
            flex: 1;
        }

        .tool-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .tool-desc {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        /* Process */
        .process-item {
            margin-bottom: 20px;
        }

        .process-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .process-name {
            font-weight: 600;
        }

        .process-percent {
            color: var(--primary);
            font-weight: 700;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: var(--border-radius-full);
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: var(--border-radius-full);
            width: 0%;
            transition: width 1s ease;
        }

        .process-desc {
            font-size: 0.85rem;
            color: var(--text-tertiary);
        }

        /* Team */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
        }

        .team-member:hover {
            background: rgba(255,255,255,0.05);
            transform: translateY(-2px);
        }

        .member-avatar {
            width: 45px;
            height: 45px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;

       /* ===== FULLSCREEN MODAL ===== */
.fullscreen-modal {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    background: rgba(0, 0, 0, 0.98);
    backdrop-filter: blur(20px);

    z-index: 10000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 75px 20px 90px;
    box-sizing: border-box;

    overflow: hidden;
}

/* إظهار نافذة التكبير */
.fullscreen-modal.active {
    display: flex;
}

/* حاوية الصورة */
.fullscreen-content {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* الصورة وقت التكبير */
.fullscreen-content img {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
    object-position: center;

    border-radius: var(--border-radius);
    box-shadow: 0 0 50px rgba(77, 166, 255, 0.2);
}

/* زر إغلاق الصورة */
.fullscreen-close {
    position: fixed;

    top: 20px;
    right: 20px;

    width: 50px;
    height: 50px;

    border-radius: var(--border-radius-full);

    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: var(--transition);

    font-size: 1.5rem;

    z-index: 10002;
}

.fullscreen-close:hover {
    background: var(--danger);
    transform: rotate(90deg);
}

/* أزرار الانتقال بين الصور */
.fullscreen-nav {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 20px;

    z-index: 10002;
}

.fullscreen-nav-btn {
    width: 50px;
    height: 50px;

    border-radius: var(--border-radius-full);

    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);

    color: white;

    cursor: pointer;

    transition: var(--transition);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 1.2rem;
}

.fullscreen-nav-btn:hover {
    background: var(--primary);
    transform: scale(1.1);
}

/* ضبط التكبير على الجوال */
@media (max-width: 768px) {
    .fullscreen-modal {
        padding: 75px 10px 85px;

    .fullscreen-nav {

        height: 45px;
    }
}

// تحميل المشروع
function loadProject() {
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');

    if (!projectId || !projectsData[projectId]) {
        window.location.href = 'index.html';
        return;
    }

    const project = projectsData[projectId];

    currentProject = project;
    currentImages = [
        project.images.main,
        ...project.images.thumbnails,
        ...(project.images.gallery || [])
    ];

    displayProject(project);

    // ===== Dynamic SEO for each project =====
    document.title = `${project.title} | ${project.category} by Momen Saleh`;

    const metaDescription = document.getElementById('metaDescription');

    if (metaDescription) {
        metaDescription.setAttribute(
            'content',
            `${project.title} by Momen Saleh - ${project.category}. ${project.shortDesc || project.description}`
        );
    }

    const canonicalUrl = document.getElementById('canonicalUrl');

    if (canonicalUrl) {
        canonicalUrl.setAttribute(
            'href',
            `https://momen-portfolio.pages.dev/project-details.html?id=${project.id}`
        );
    }
}

                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Tags -->
                        <div class="content-card">
                            <div class="card-header">
                                <div class="card-header-icon"><i class="fas fa-tags"></i></div>
                                <h3>الكلمات المفتاحية</h3>
                            </div>
                            
                            <div class="tags-cloud">
                                ${p.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        </div>

                        <!-- Team -->
                        <div class="content-card">
                            <div class="card-header">
                                <div class="card-header-icon"><i class="fas fa-users"></i></div>
                                <h3>فريق العمل</h3>
                            </div>
                            
                            <div class="team-grid">
                                ${p.team.map(member => `
                                    <div class="team-member">
                                        <div class="member-avatar">${member.name.charAt(0)}</div>
                                        <div class="member-info">
                                            <div class="member-name">${member.name}</div>
                                            <div class="member-role">${member.role}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Testimonial -->
                        <div class="testimonial-card">
                            <div class="testimonial-quote">"</div>
                            <p class="testimonial-text">${p.testimonial.text}</p>
                            <div class="testimonial-author">
                                <div class="author-avatar">${p.testimonial.author.charAt(0)}</div>
                                <div class="author-info">
                                    <h4>${p.testimonial.author}</h4>
                                    <p>${p.testimonial.position}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gallery Scroll -->
                ${p.images.gallery ? `
                <div class="gallery-scroll-section">
                    <div class="scroll-header">
                        <h3><i class="fas fa-images" style="color: var(--primary); margin-left: 10px;"></i> معرض الصور</h3>
                        <div class="scroll-controls">
                            <button class="scroll-btn" onclick="scrollGallery('left')"><i class="fas fa-chevron-right"></i></button>
                            <button class="scroll-btn" onclick="scrollGallery('right')"><i class="fas fa-chevron-left"></i></button>
                        </div>
                    </div>
                    
                    <div class="gallery-scroll" id="galleryScroll">
                        ${p.images.gallery.map(img => `
                            <div class="scroll-item" onclick="openFullscreen('${img}')">
                                <img src="${img}" alt="Gallery">
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <a href="${p.livePreview}" target="_blank" class="btn btn-primary">
                        <i class="fas fa-eye"></i>
                        <span>معاينة حية</span>
                    </a>
                    <button class="btn btn-secondary" onclick="downloadProject()">
                        <i class="fas fa-download"></i>
                        <span>تحميل الملفات</span>
                    </button>
                    <button class="btn btn-secondary" onclick="shareProject()">
                        <i class="fas fa-share-alt"></i>
                        <span>مشاركة</span>
                    </button>
                </div>
            `;
            
            contentDiv.innerHTML = html;
            
            // تفعيل الـ scroll بعد تحميل الصفحة
            setTimeout(() => {
                initScroll();
            }, 100);
        }

        // تغيير الصورة الرئيسية
        window.changeMainImage = function(src, index) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.gallery-thumb').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            currentImageIndex = index;
        };

        // Fullscreen
        window.openFullscreen = function(src) {
            const modal = document.getElementById('fullscreenModal');
            const img = document.getElementById('fullscreenImage');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            currentImageIndex = currentImages.indexOf(src);
            if (currentImageIndex === -1) currentImageIndex = 0;
        };

        window.closeFullscreen = function() {
            document.getElementById('fullscreenModal').classList.remove('active');
            document.body.style.overflow = '';
        };

        window.prevImage = function() {
            if (!currentImages.length) return;
            currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
            document.getElementById('fullscreenImage').src = currentImages[currentImageIndex];
        };

        window.nextImage = function() {
            if (!currentImages.length) return;
            currentImageIndex = (currentImageIndex + 1) % currentImages.length;
            document.getElementById('fullscreenImage').src = currentImages[currentImageIndex];
        };

        // نسخ اللون
        window.copyColor = function(hex) {
            navigator.clipboard.writeText(hex).then(() => {
                showNotification(`✅ تم نسخ اللون: ${hex}`);
            });
        };

        // مشاركة
        window.shareProject = function() {
            if (!currentProject) return;
            
            if (navigator.share) {
                navigator.share({
                    title: currentProject.titleAr || currentProject.title,
                    text: currentProject.shortDesc,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showNotification('✅ تم نسخ الرابط');
                });
            }
        };

        // تحميل
        window.downloadProject = function() {
            showNotification('📥 جاري التحميل...');
        };

        // Scroll gallery
        window.scrollGallery = function(direction) {
            const gallery = document.getElementById('galleryScroll');
            const scrollAmount = 320;
            if (gallery) {
                gallery.scrollBy({
                    left: direction === 'right' ? scrollAmount : -scrollAmount,
                    behavior: 'smooth'
                });
            }
        };

        function initScroll() {
            const gallery = document.getElementById('galleryScroll');
            if (gallery) {
                gallery.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    gallery.scrollLeft += e.deltaY;
                });
            }
        }

        // إشعار
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                backdrop-filter: blur(10px);
                color: white;
                padding: 15px 30px;
                border-radius: 60px;
                border: 1px solid rgba(255,255,255,0.1);
                z-index: 10001;
                font-weight: 500;
                animation: slideUp 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideDown 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('fullscreenModal');
            if (modal && modal.classList.contains('active')) {
                if (e.key === 'Escape') closeFullscreen();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        // تحميل المشروع
        document.addEventListener('DOMContentLoaded', loadProject);
    </script>
</body>
</html>
